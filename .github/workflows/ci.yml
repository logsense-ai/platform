name: Java CI with Gradle

on:
  push:
    branches: [ "chore/ci-update" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/logsense_test
      TEST_DB_USERNAME: logsense
      TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: logsense_test
          POSTGRES_USER: logsense
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U logsense -d logsense_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./gradlew clean build --no-daemon